<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CARLA Autonomous Dashboard</title>
    <style>
        body { background-color: #1a1a1a; color: #0f0; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .panel { position: relative; border: 2px solid #333; }
        .panel h3 { position: absolute; top: 0; left: 0; background: rgba(0,0,0,0.7); margin: 0; padding: 5px; color: white; }
        canvas { display: block; background: #000; }
        #radarView { background: #001100; }
    </style>
</head>
<body>
    <h1>CARLA UKF & TensorFlow Viz</h1>
    <div class="dashboard">
        <div class="panel">
            <h3>RGB Camera + Boxes</h3>
            <canvas id="rgbCanvas" width="640" height="480"></canvas>
        </div>

        <div class="panel">
            <h3>TensorFlow Segmentation</h3>
            <canvas id="segCanvas" width="640" height="480"></canvas>
        </div>

        <div class="panel">
            <h3>Sensor Fusion (Lidar+Radar+UKF)</h3>
            <canvas id="radarCanvas" width="640" height="480"></canvas>
        </div>
        
        <div class="panel" style="padding: 20px; width: 600px; color: white;">
            <h3>Stats</h3>
            <p>Connection: <span id="status" style="color: red">Disconnected</span></p>
            <p>UKF Estimate (Relative): <span id="ukfVal">Waiting...</span></p>
            <p>Visible Actors: <span id="actorCount">0</span></p>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8765");
        
        // Get all canvas contexts with explicit error checking
        const rgbCanvas = document.getElementById('rgbCanvas');
        const segCanvas = document.getElementById('segCanvas');
        const radarCanvas = document.getElementById('radarCanvas');
        
        if (!rgbCanvas || !segCanvas || !radarCanvas) {
            console.error('ERROR: Canvas elements not found!');
        }
        
        const rgbCtx = rgbCanvas.getContext('2d');
        const segCtx = segCanvas.getContext('2d');
        const radarCtx = radarCanvas.getContext('2d');
        const statusSpan = document.getElementById('status');
        
        const RADAR_W = 640, RADAR_H = 480;
        const SCALE = 10; // Pixels per meter
        
        let messageCount = 0;

        ws.onopen = () => { 
            statusSpan.textContent = "Connected"; 
            statusSpan.style.color = "lime";
            console.log('✅ WebSocket Connected!');
        };
        
        ws.onerror = (error) => {
            console.error('❌ WebSocket Error:', error);
            statusSpan.textContent = "Error";
            statusSpan.style.color = "red";
        };
        
        ws.onclose = () => {
            console.log('⚠️ WebSocket Closed');
            statusSpan.textContent = "Disconnected";
            statusSpan.style.color = "red";
        };
        
        ws.onmessage = (event) => {
            try {
                messageCount++;
                console.log(`📊 Message #${messageCount} received`);
                
                const data = JSON.parse(event.data);
                
                // Verify data structure
                if (!data.rgb || !data.seg) {
                    console.warn('⚠️ Missing image data:', {hasRgb: !!data.rgb, hasSeg: !!data.seg});
                }

                // 1. Draw RGB Image
                const img = new Image();
                img.onload = () => {
                    console.log('✅ RGB image loaded');
                    rgbCtx.drawImage(img, 0, 0);
                    
                    // Draw Bounding Boxes Overlay
                    rgbCtx.lineWidth = 2;
                    rgbCtx.font = "16px Arial";
                    data.boxes.forEach(box => {
                        // Draw target bracket
                        rgbCtx.strokeStyle = "#00FF00";
                        rgbCtx.strokeRect(box.u - 20, box.v - 20, 40, 40);
                        
                        // Draw Label
                        rgbCtx.fillStyle = "#00FF00";
                        rgbCtx.fillText(`ID:${box.id}`, box.u - 20, box.v - 25);
                        rgbCtx.fillStyle = "white";
                        rgbCtx.fillText(`${box.dist}m`, box.u - 20, box.v + 35);
                    });
                };
                img.onerror = () => console.error('❌ Failed to load RGB image');
                img.src = "data:image/jpeg;base64," + data.rgb;

                // 2. Draw Segmentation Image
                const imgSeg = new Image();
                imgSeg.onload = () => {
                    console.log('✅ Segmentation image loaded');
                    segCtx.drawImage(imgSeg, 0, 0);
                };
                imgSeg.onerror = () => console.error('❌ Failed to load segmentation image');
                imgSeg.src = "data:image/jpeg;base64," + data.seg;

                // 3. Draw Radar/Lidar View (Top-Down)
                radarCtx.fillStyle = "#000000";
                radarCtx.fillRect(0, 0, RADAR_W, RADAR_H);
                radarCtx.clearRect(0, 0, RADAR_W, RADAR_H);
                
                // Draw Grid for reference
                radarCtx.strokeStyle = "#333333";
                radarCtx.lineWidth = 1;
                for (let i = 0; i <= 640; i += 64) {
                    radarCtx.beginPath();
                    radarCtx.moveTo(i, 0);
                    radarCtx.lineTo(i, 480);
                    radarCtx.stroke();
                    radarCtx.beginPath();
                    radarCtx.moveTo(0, i);
                    radarCtx.lineTo(640, i);
                    radarCtx.stroke();
                }
                
                // Draw Ego Vehicle (Center Bottom) - YELLOW
                const cx = RADAR_W / 2;
                const cy = RADAR_H - 50;
                
                radarCtx.fillStyle = "#FFFF00";  // Bright yellow
                radarCtx.fillRect(cx - 15, cy - 25, 30, 50); // Larger car for visibility
                
                // Draw car outline
                radarCtx.strokeStyle = "#FFFFFF";
                radarCtx.lineWidth = 2;
                radarCtx.strokeRect(cx - 15, cy - 25, 30, 50);
                
                // Draw direction indicator
                radarCtx.strokeStyle = "#FFFFFF";
                radarCtx.lineWidth = 2;
                radarCtx.beginPath();
                radarCtx.moveTo(cx, cy - 25);
                radarCtx.lineTo(cx, cy - 40);
                radarCtx.stroke();
                
                console.log(`✅ Ego vehicle drawn at (${cx}, ${cy})`);
                
                // Draw Lidar Points (Cyan)
                if (data.lidar && data.lidar.length > 0) {
                    radarCtx.fillStyle = "rgba(0, 255, 255, 0.7)";
                    data.lidar.forEach(p => {
                        const x = cx + p[1] * SCALE; 
                        const y = cy - p[0] * SCALE;
                        radarCtx.fillRect(x - 1, y - 1, 2, 2);
                    });
                    console.log(`✅ Drew ${data.lidar.length} LIDAR points`);
                }

                // Draw Radar Points (Magenta)
                if (data.radar && data.radar.length > 0) {
                    radarCtx.fillStyle = "#FF00FF";
                    data.radar.forEach(p => {
                        const x = cx + p[1] * SCALE; 
                        const y = cy - p[0] * SCALE;
                        radarCtx.beginPath();
                        radarCtx.arc(x, y, 4, 0, Math.PI * 2);
                        radarCtx.fill();
                    });
                    console.log(`✅ Drew ${data.radar.length} RADAR points`);
                }

                // Draw UKF Tracking Estimate (Green Target)
                if (data.ukf) {
                    const ux = cx + data.ukf[1] * SCALE;
                    const uy = cy - data.ukf[0] * SCALE;
                    radarCtx.strokeStyle = "#00FF00";
                    radarCtx.lineWidth = 2;
                    radarCtx.beginPath();
                    radarCtx.arc(ux, uy, 10, 0, Math.PI*2);
                    radarCtx.stroke();
                    
                    // Draw crosshair
                    radarCtx.beginPath();
                    radarCtx.moveTo(ux - 15, uy);
                    radarCtx.lineTo(ux + 15, uy);
                    radarCtx.moveTo(ux, uy - 15);
                    radarCtx.lineTo(ux, uy + 15);
                    radarCtx.stroke();
                    
                    document.getElementById('ukfVal').textContent = 
                        `X: ${data.ukf[0].toFixed(2)}, Y: ${data.ukf[1].toFixed(2)}`;
                }
                
                document.getElementById('actorCount').textContent = data.boxes.length;
            } catch (error) {
                console.error('❌ Message processing error:', error);
            }
        };
    </script>
</body>
</html>
